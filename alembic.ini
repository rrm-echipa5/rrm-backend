# Configurarea Alembic pentru migrările bazei de date (KAN-85).
# Adresa bazei nu stă aici: `migrations/env.py` o ia din `RRM_DATABASE_URL` (sau din `.env`),
# la fel ca aplicația.
#   uv run alembic upgrade head      aplică migrările
#   uv run alembic downgrade base    le anulează pe toate
# O bază creată din `db/schema.sql` (docker compose, CI) are deja schema revizii 0001;
# înainte de prima migrare nouă se marchează o singură dată cu `uv run alembic stamp 0001`.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
